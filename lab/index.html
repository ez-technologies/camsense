<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>camsense</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0 auto; max-width: 640px; padding: 10px; background: #111; color: #eee; font: 15px system-ui, sans-serif; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      h1 { font-size: 20px; margin: 4px 0; }
      .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 8px 0; }
      .tabs button { padding: 10px 4px; }
      .tabs button[aria-selected='true'] { background: #1565c0; border-color: #1565c0; }
      camsense-scanner { width: 100%; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 0; }
      .row label { display: flex; align-items: center; gap: 4px; }
      button, select { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: #eee; }
      button.big { width: 100%; padding: 16px; font-size: 20px; background: #1565c0; border: none; }
      button:disabled { opacity: 0.5; }
      #status { color: #aaa; min-height: 1.4em; }
      #result img { width: 100%; border-radius: 8px; display: block; }
      #result ul { padding-inline-start: 20px; }
      #result li { margin: 4px 0; font-size: 17px; }
      #result small { color: #999; font-size: 13px; }
      #result h3 { font-size: 14px; color: #aaa; margin: 14px 0 6px; }
      #result h4 { margin: 10px 0 4px; }
      .entry { border-top: 1px solid #333; }
      button[aria-pressed='true'] { background: #1565c0; border-color: #1565c0; }
      .hint { color: #999; font-size: 13px; }
      a { color: #64b5f6; }
    </style>
  </head>
  <body>
    <header>
      <h1>camsense</h1>
      <button id="lang">English</button>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="code"></button>
      <button role="tab" data-tab="barcode"></button>
      <button role="tab" data-tab="document"></button>
      <button role="tab" data-tab="receipt"></button>
    </nav>
    <p class="hint" id="hint"></p>
    <camsense-scanner id="cam" autostart></camsense-scanner>
    <div class="row">
      <span id="whenDone"></span>
      <label><input type="checkbox" id="fb-beep" /> <span data-t="beep"></span></label>
      <label><input type="checkbox" id="fb-vibrate" /> <span data-t="vibrate"></span></label>
      <label><input type="checkbox" id="fb-flash" /> <span data-t="flash"></span></label>
    </div>
    <div class="row">
      <button id="mirror" data-t="mirror" aria-pressed="false"></button>
      <button id="torch" data-t="torch"></button>
      <span id="readRow"><span data-t="readLang"></span>
        <select id="readLang"><option value="latin" data-t="latin"></option><option value="he" data-t="hebrew"></option></select></span>
    </div>
    <button class="big" id="go"></button>
    <p id="status" role="status"></p>
    <div id="result"></div>
    <button id="clear" data-t="clear"></button>
    <p class="hint"><a href="lab.html" data-t="labLink"></a> · <a href="https://github.com/ez-technologies/camsense">GitHub</a></p>
    <script type="module" src="./play.ts"></script>
  </body>
</html>
